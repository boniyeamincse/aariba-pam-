openapi: 3.1.0
info:
  title: Ariba PAM Control Plane
  description: Ariba PAM - Privileged Access Management Control Plane
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Health & Operability
      summary: Health Check
      description: Liveness probe confirming service process is up.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - Health & Operability
      summary: Readiness Check
      description: Readiness probe verifying operational database connectivity.
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/components:
    get:
      tags:
      - Health & Operability
      summary: Component Health Check
      description: Deep component health probe for NFR-08 (99.95% availability & health
        probes).
      operationId: component_health_check_health_components_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/login:
    post:
      tags:
      - Authentication & Identity
      summary: Synthetic Login
      description: Synthetic IdP login endpoint for the lab environment.
      operationId: synthetic_login_api_v1_auth_login_post
      parameters:
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_synthetic_login
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyntheticLoginInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Synthetic Login Api V1 Auth Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      tags:
      - Authentication & Identity
      summary: Get Me
      description: GET /api/v1/me - Returns caller principal, active roles, and resource
        scopes.
      operationId: get_me_api_v1_me_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/idp-events:
    post:
      tags:
      - Authentication & Identity
      summary: Idp Lifecycle Event
      description: 'Ingest IdP lifecycle events (e.g. user.disabled, user.deprovisioned).

        Deduplicates events, invalidates identity, immediately revokes active grants,

        and terminates associated sessions within the 60s NFR-01 propagation window.'
      operationId: idp_lifecycle_event_api_v1_auth_idp_events_post
      parameters:
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_idp_event
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdPLifecycleEventInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Idp Lifecycle Event Api V1 Auth Idp Events Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets:
    get:
      tags:
      - Asset & Target Inventory
      summary: List Assets
      description: 'List permitted assets and their active target accounts.

        Default deny: only assets matching the user''s role assignments are returned.'
      operationId: list_assets_api_v1_assets_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetResponse'
                title: Response List Assets Api V1 Assets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{asset_id}:
    get:
      tags:
      - Asset & Target Inventory
      summary: Get Asset
      description: 'Retrieve single asset details if within caller''s scope.

        Guessed or out-of-scope identifiers return 404 to conceal restricted assets.'
      operationId: get_asset_api_v1_assets__asset_id__get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/requests:
    post:
      tags:
      - Access Requests
      summary: Submit Access Request
      description: 'Submit an access request with an immutable first revision (P2-02).

        Evaluates policy against requested window and account.

        Replay with same idempotency key returns the same request without repeating
        state change.'
      operationId: submit_access_request_api_v1_requests_post
      parameters:
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_request_submit
          title: X-Correlation-Id
      - name: x-idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Idempotency-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Submit Access Request Api V1 Requests Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Access Requests
      summary: List Requests
      description: List requests visible to requester or scoped reviewer.
      operationId: list_requests_api_v1_requests_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Requests Api V1 Requests Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/requests/{request_id}:
    get:
      tags:
      - Access Requests
      summary: Get Request
      description: View a scoped request, its current revision, and revision history
        (P2-03).
      operationId: get_request_api_v1_requests__request_id__get
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Request Api V1 Requests  Request Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/requests/{request_id}/revisions:
    post:
      tags:
      - Access Requests
      summary: Replace Request Revision
      description: 'Replace a pending revision with changed fields and expected revision
        ID (P2-03).

        A stale change fails with 409 Conflict. Historical fields remain unchanged.'
      operationId: replace_request_revision_api_v1_requests__request_id__revisions_post
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_request_revision_replace
          title: X-Correlation-Id
      - name: x-idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Idempotency-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRevisionInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Replace Request Revision Api V1 Requests  Request
                  Id  Revisions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/requests/{request_id}/cancel:
    post:
      tags:
      - Access Requests
      summary: Cancel Request
      description: Cancel a pending request as the requester.
      operationId: cancel_request_api_v1_requests__request_id__cancel_post
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_request_cancel
          title: X-Correlation-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Cancel Request Api V1 Requests  Request Id  Cancel
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/approvals:
    get:
      tags:
      - Approvals & Decision Control
      summary: List Pending Approvals
      description: List pending approval steps within the caller's scoped authority.
      operationId: list_pending_approvals_api_v1_approvals_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Pending Approvals Api V1 Approvals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/approval-steps/{step_id}/decisions:
    post:
      tags:
      - Approvals & Decision Control
      summary: Record Decision
      description: 'Record an approval or rejection.

        Enforces separation of duties (no self-approval), scope checks, and atomic
        grant issuance.'
      operationId: record_decision_api_v1_approval_steps__step_id__decisions_post
      parameters:
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          title: Step Id
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_approval_decision
          title: X-Correlation-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Record Decision Api V1 Approval Steps  Step Id  Decisions
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/grants/{grant_id}:
    get:
      tags:
      - Grants & Session Launch
      summary: Get Grant
      description: View grant details within caller's scope.
      operationId: get_grant_api_v1_grants__grant_id__get
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          title: Grant Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Grant Api V1 Grants  Grant Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/grants/{grant_id}/launches:
    post:
      tags:
      - Grants & Session Launch
      summary: Create Session Launch
      description: 'Create a single-use launch authorization for the grant owner.

        Launch token digest is stored; raw token is returned once to the caller.'
      operationId: create_session_launch_api_v1_grants__grant_id__launches_post
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          title: Grant Id
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_launch_create
          title: X-Correlation-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Session Launch Api V1 Grants  Grant Id  Launches
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/grants/{grant_id}/revoke:
    post:
      tags:
      - Grants & Session Launch
      summary: Revoke Grant
      description: 'Commit grant revocation as a scoped security operator.

        Blocks new launches and marks active sessions for termination.'
      operationId: revoke_grant_api_v1_grants__grant_id__revoke_post
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          title: Grant Id
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_grant_revoke
          title: X-Correlation-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeGrantInput'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Revoke Grant Api V1 Grants  Grant Id  Revoke Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions:
    get:
      tags:
      - Session Operations
      summary: List Sessions
      description: List visible sessions within caller's scope.
      operationId: list_sessions_api_v1_sessions_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Sessions Api V1 Sessions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}:
    get:
      tags:
      - Session Operations
      summary: Get Session
      description: View session state within caller scope.
      operationId: get_session_api_v1_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Session Api V1 Sessions  Session Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/terminate:
    post:
      tags:
      - Session Operations
      summary: Terminate Session
      description: Terminate own session or one in operator scope.
      operationId: terminate_session_api_v1_sessions__session_id__terminate_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_session_terminate
          title: X-Correlation-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Terminate Session Api V1 Sessions  Session Id  Terminate
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/change-proposals:
    post:
      tags:
      - Administration & Change Control
      summary: Submit Change Proposal
      description: Submit a proposed change to inventory, roles, or policy for independent
        review.
      operationId: submit_change_proposal_api_v1_admin_change_proposals_post
      parameters:
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_admin_proposal
          title: X-Correlation-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProposalInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Submit Change Proposal Api V1 Admin Change Proposals
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/change-proposals/{proposal_id}:
    get:
      tags:
      - Administration & Change Control
      summary: Get Change Proposal
      description: View a scoped change proposal.
      operationId: get_change_proposal_api_v1_admin_change_proposals__proposal_id__get
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          title: Proposal Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Change Proposal Api V1 Admin Change Proposals  Proposal
                  Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/change-proposals/{proposal_id}/decisions:
    post:
      tags:
      - Administration & Change Control
      summary: Decide Change Proposal
      description: 'Apply or reject an independently reviewed change.

        Separation of duties: Author cannot review their own proposal.'
      operationId: decide_change_proposal_api_v1_admin_change_proposals__proposal_id__decisions_post
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          title: Proposal Id
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
          default: corr_admin_decision
          title: X-Correlation-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProposalDecisionInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Decide Change Proposal Api V1 Admin Change Proposals  Proposal
                  Id  Decisions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/backup/snapshots:
    post:
      tags:
      - Administration & Change Control
      summary: Create Backup Snapshot
      description: Create a point-in-time snapshot across all PAM tables and compute
        manifest digest.
      operationId: create_backup_snapshot_api_v1_admin_backup_snapshots_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Backup Snapshot Api V1 Admin Backup Snapshots
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/backup/restore-rehearsal:
    post:
      tags:
      - Administration & Change Control
      summary: Execute Restore Rehearsal
      description: 'Execute disaster recovery restore rehearsal in isolated staging
        session (P5-07 / NFR-04, T-09).

        Measures RTO/RPO, verifies WORM evidence integrity, and reconciles stale grants
        fail-closed.'
      operationId: execute_restore_rehearsal_api_v1_admin_backup_restore_rehearsal_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRehearsalInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
