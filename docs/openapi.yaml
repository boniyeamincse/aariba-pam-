openapi: 3.1.0
info:
  title: Ariba PAM API
  version: 1.1.0
  description: |
    Ariba PAM privileged access management API v1.1.
    Browser APIs require an authenticated session and CSRF protection.
    Internal APIs require mutually authenticated service identities.
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Public portal API
  - url: /
    description: Internal service API
security:
  - BrowserSession: []

tags:
  - name: Identity
  - name: RBAC
  - name: Assets
  - name: Accounts
  - name: Vault
  - name: Requests
  - name: Approvals
  - name: Grants
  - name: Sessions
  - name: Emergency
  - name: Rotation
  - name: Discovery
  - name: Integrations
  - name: Notifications
  - name: Reports
  - name: Audit
  - name: Health
  - name: Administration
  - name: Internal Gateway

components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: pam_session
    GatewayIdentity:
      type: mutualTLS

  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required for non-idempotent state-changing operations.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 4096
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    ETag:
      description: Resource version for optimistic concurrency.
      schema:
        type: string
    RetryAfter:
      description: Seconds before retrying.
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated caller lacks role or resource scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Missing or concealed resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Invalid state, stale resource version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Required authorization or evidence service unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          examples: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, STALE_RESOURCE_VERSION, IDENTITY_KEY_REUSE]
        message:
          type: string
          maxLength: 500
        request_id:
          type: string
        details:
          type: array
          items:
            type: object

    CursorPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true

    Timestamp:
      type: string
      format: date-time

    User:
      type: object
      additionalProperties: false
      required: [id, subject, display_name, status]
      properties:
        id: {type: string, example: user_demo}
        subject: {type: string, example: catalog-demo}
        display_name: {type: string, example: Demo Privileged User}
        email: {type: string, format: email, example: catalog-demo@example.test}
        status: {type: string, enum: [active, suspended, disabled, locked]}
        version: {type: integer, minimum: 0}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}

    Asset:
      type: object
      additionalProperties: false
      required: [id, name, type, status]
      properties:
        id: {type: string, example: asset_demo}
        name: {type: string, minLength: 1, maxLength: 200}
        type:
          type: string
          enum: [linux_server, windows_server, network_device, firewall, database_server, cloud_infrastructure, virtualization_platform, kubernetes_infrastructure]
        address: {type: string, maxLength: 500}
        zone: {type: string, example: lab-zone-a}
        status: {type: string, enum: [active, disabled, unreachable]}
        version: {type: integer, minimum: 0}

    PrivilegedAccount:
      type: object
      additionalProperties: false
      required: [id, asset_id, name, category, status]
      properties:
        id: {type: string, example: account_demo}
        asset_id: {type: string, example: asset_demo}
        name: {type: string, maxLength: 200}
        category:
          type: string
          enum: [root, administrator, service_account, database_administrator, network_administrator, privileged_account]
        vault_secret_id: {type: string, nullable: true}
        status: {type: string, enum: [active, disabled, verification_failed]}
        version: {type: integer, minimum: 0}

    AccessRequest:
      type: object
      additionalProperties: false
      required: [id, revision_id, asset_id, target_account_id, requested_start_at, requested_end_at, justification, state]
      properties:
        id: {type: string, example: req_demo}
        revision_id: {type: string, example: rev_demo}
        asset_id: {type: string, example: asset_demo}
        target_account_id: {type: string, example: account_demo}
        requested_start_at: {$ref: '#/components/schemas/Timestamp'}
        requested_end_at: {$ref: '#/components/schemas/Timestamp'}
        justification: {type: string, minLength: 10, maxLength: 2000}
        ticket_ref: {type: string, maxLength: 200, nullable: true}
        state: {type: string, enum: [pending, approved, rejected, cancelled, expired]}
        policy_version_id: {type: string}

    Grant:
      type: object
      additionalProperties: false
      required: [id, subject, target_asset_id, target_account_id, effective_start_at, effective_end_at, status]
      properties:
        id: {type: string, example: grant_demo}
        subject: {type: string, example: user_demo}
        target_asset_id: {type: string, example: asset_demo}
        target_account_id: {type: string, example: account_demo}
        effective_start_at: {$ref: '#/components/schemas/Timestamp'}
        effective_end_at: {$ref: '#/components/schemas/Timestamp'}
        status: {type: string, enum: [active, expired, revoked]}

    Session:
      type: object
      additionalProperties: false
      required: [id, grant_id, gateway_id, status]
      properties:
        id: {type: string, example: session_demo}
        grant_id: {type: string, example: grant_demo}
        gateway_id: {type: string, example: gateway_demo}
        status: {type: string, enum: [requested, active, paused, terminated, ended, expired]}
        reason_code: {type: string, nullable: true}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        ended_at: {$ref: '#/components/schemas/Timestamp'}

    Role:
      type: object
      additionalProperties: false
      required: [id, name, permissions]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        permissions:
          type: array
          items: {type: string}
        scope_ids:
          type: array
          items: {type: string}
        version: {type: integer, minimum: 0}

paths:
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentPrincipal
      description: Requires authenticated browser session. Returns permitted scope summaries.
      responses:
        '200': {description: Current principal, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/methods:
    get:
      tags: [Identity]
      operationId: listAuthMethods
      responses:
        '200': {description: Enabled authentication methods, content: {application/json: {schema: {type: object, properties: {methods: {type: array, items: {type: string, enum: [totp, webauthn, oidc, saml, ldap]}}}}}}}

  /auth/mfa/enroll:
    post:
      tags: [Identity]
      operationId: enrollMfa
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/XRequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: {type: string, enum: [totp, webauthn]}
      responses:
        '201': {description: Enrollment started}

  /auth/mfa/verify:
    post:
      tags: [Identity]
      operationId: verifyMfa
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: {type: string}
                code: {type: string, minLength: 6, maxLength: 12}
      responses:
        '200': {description: MFA verified}

  /auth/mfa/disable:
    post:
      tags: [Identity]
      operationId: disableMfa
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_up_token]
              properties:
                step_up_token: {type: string}
      responses:
        '200': {description: MFA disabled}

  /auth/mfa/recovery-codes:
    post:
      tags: [Identity]
      operationId: generateRecoveryCodes
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_up_token]
              properties:
                step_up_token: {type: string}
      responses:
        '201': {description: Recovery codes generated}

  /auth/step-up:
    post:
      tags: [Identity]
      operationId: startStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: {type: string, enum: [credential_access, policy_change, emergency_access, session_termination, audit_export, role_assignment]}
      responses:
        '200': {description: Step-up challenge issued}

  /auth/devices:
    get:
      tags: [Identity]
      operationId: listTrustedDevices
      responses:
        '200': {description: Trusted devices, content: {application/json: {schema: {$ref: '#/components/schemas/CursorPage'}}}}

  /auth/devices/{device_id}:
    parameters:
      - name: device_id
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [Identity]
      operationId: revokeTrustedDevice
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Device revoked}

  /users:
    get:
      tags: [Identity]
      operationId: listUsers
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/CursorPage'}}}}
    post:
      tags: [Identity]
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, display_name]
              properties:
                subject: {type: string, minLength: 1, maxLength: 255}
                display_name: {type: string, minLength: 1, maxLength: 200}
                email: {type: string, format: email}
      responses:
        '201': {description: User created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}

  /users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Identity]
      operationId: getUser
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
    patch:
      tags: [Identity]
      operationId: updateUser
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      headers:
        If-Match:
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, minLength: 1, maxLength: 200}
                email: {type: string, format: email}
                status: {type: string, enum: [active, suspended, locked]}
      responses:
        '200': {description: User updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}

  /users/{user_id}/activate:
    post:
      tags: [Identity]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason: {type: string, maxLength: 2000}}}}}}
      responses:
        '200': {description: User activated}

  /users/{user_id}/suspend:
    post:
      tags: [Identity]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 2000}
      responses:
        '202': {description: Suspension and session revocation accepted}

  /users/{user_id}/unlock:
    post:
      tags: [Identity]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Account unlocked}

  /users/{user_id}/access:
    get:
      tags: [Identity]
      operationId: getUserAccess
      responses:
        '200': {description: Effective roles, scopes, grants, and sessions}

  /users/{user_id}/sessions:
    get:
      tags: [Identity]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Active sessions, content: {application/json: {schema: {$ref: '#/components/schemas/CursorPage'}}}}

  /admin/roles:
    get:
      tags: [RBAC]
      operationId: listRoles
      responses:
        '200': {description: Roles, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Role'}}}}}
    post:
      tags: [RBAC]
      operationId: createRole
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                permissions: {type: array, items: {type: string}}
                scope_ids: {type: array, items: {type: string}}
      responses:
        '201': {description: Role created, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}

  /admin/roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [RBAC]
      operationId: updateRole
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                permissions: {type: array, items: {type: string}}
                scope_ids: {type: array, items: {type: string}}
                expected_version: {type: integer, minimum: 0}
      responses:
        '200': {description: Role updated}

  /admin/permissions:
    get:
      tags: [RBAC]
      operationId: listPermissions
      responses:
        '200': {description: Available permission IDs}

  /admin/roles/{role_id}/permissions:
    put:
      tags: [RBAC]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids: {type: array, uniqueItems: true, items: {type: string}}
      responses:
        '200': {description: Permissions assigned}

  /admin/users/{user_id}/roles:
    get:
      tags: [RBAC]
      responses:
        '200': {description: Assigned roles and effective scopes}
    put:
      tags: [RBAC]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids: {type: array, uniqueItems: true, items: {type: string}}
      responses:
        '200': {description: Roles assigned}

  /admin/users/{user_id}/roles/{role_id}:
    delete:
      tags: [RBAC]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Role removed}

  /assets:
    get:
      tags: [Assets]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Visible assets}
    post:
      tags: [Assets]
      operationId: registerAsset
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                type: {type: string, enum: [linux_server, windows_server, network_device, firewall, database_server, cloud_infrastructure, virtualization_platform, kubernetes_infrastructure]}
                address: {type: string, maxLength: 500}
                zone: {type: string, maxLength: 100}
      responses:
        '201': {description: Asset registered, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}

  /assets/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Assets]
      responses:
        '200': {description: Asset details, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
    patch:
      tags: [Assets]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                address: {type: string, maxLength: 500}
                zone: {type: string, maxLength: 100}
                status: {type: string, enum: [active, disabled]}
                expected_version: {type: integer, minimum: 0}
      responses:
        '200': {description: Asset updated}

  /assets/{asset_id}/disable:
    post:
      tags: [Assets]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 2000}
      responses:
        '202': {description: Asset disable accepted}

  /assets/{asset_id}/accounts:
    get:
      tags: [Assets, Accounts]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Privileged accounts}

  /assets/{asset_id}/discovery:
    post:
      tags: [Assets, Discovery]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: {type: string, enum: [linux_ssh, active_directory, database, network_device, cloud, virtualization]}
      responses:
        '202': {description: Discovery accepted}

  /assets/{asset_id}/health:
    get:
      tags: [Assets]
      responses:
        '200': {description: Non-sensitive asset connectivity health}

  /accounts:
    get:
      tags: [Accounts]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Privileged accounts}
    post:
      tags: [Accounts]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id, name, category]
              properties:
                asset_id: {type: string}
                name: {type: string, minLength: 1, maxLength: 200}
                category: {type: string, enum: [root, administrator, service_account, database_administrator, network_administrator, privileged_account]}
                vault_secret_id: {type: string, nullable: true}
      responses:
        '201': {description: Account registered, content: {application/json: {schema: {$ref: '#/components/schemas/PrivilegedAccount'}}}}

  /accounts/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Accounts]
      responses:
        '200': {description: Account metadata, content: {application/json: {schema: {$ref: '#/components/schemas/PrivilegedAccount'}}}}
    patch:
      tags: [Accounts]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                vault_secret_id: {type: string, nullable: true}
                status: {type: string, enum: [active, disabled]}
                expected_version: {type: integer, minimum: 0}
      responses:
        '200': {description: Account updated}

  /accounts/{account_id}/disable:
    post:
      tags: [Accounts]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 2000}
      responses:
        '202': {description: Account disable accepted}

  /accounts/{account_id}/health:
    get:
      tags: [Accounts]
      responses:
        '200': {description: Account verification state}

  /accounts/{account_id}/verify:
    post:
      tags: [Accounts, Vault]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Credential verification started}

  /accounts/{account_id}/rotate:
    post:
      tags: [Accounts, Rotation]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                policy_id: {type: string}
      responses:
        '202': {description: Rotation started}

  /accounts/{account_id}/rotation-history:
    get:
      tags: [Accounts, Rotation]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Rotation history}

  /vault/secrets:
    get:
      tags: [Vault]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Secret metadata only}
    post:
      tags: [Vault]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                type: {type: string, enum: [password, ssh_private_key, api_token, database_credential, other]}
                plaintext:
                  type: string
                  format: password
                  writeOnly: true
                  description: Secret plaintext is accepted only at vault ingress and never returned.
      responses:
        '201': {description: Secret metadata created}

  /vault/secrets/{secret_id}:
    parameters:
      - name: secret_id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Vault]
      responses:
        '200': {description: Secret metadata; plaintext never returned}
    put:
      tags: [Vault]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                plaintext: {type: string, format: password, writeOnly: true}
                expected_version: {type: integer, minimum: 0}
      responses:
        '200': {description: Secret version created}

  /vault/secrets/{secret_id}/rotate:
    post:
      tags: [Vault, Rotation]
