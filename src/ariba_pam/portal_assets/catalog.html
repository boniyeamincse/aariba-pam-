<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset catalog · Ariba PAM</title>
  <link rel="stylesheet" href="/portal/catalog.css">
  <script type="module" src="/portal/catalog.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-content">
      <span class="brand">Ariba <strong>PAM</strong></span>
      <span class="environment">Lab environment</span>
    </div>
  </header>
  <main>
    <div class="page-heading">
      <div>
        <h1>Asset catalog</h1>
        <p>Browse the systems and accounts available to your identity.</p>
      </div>
      <button id="sign-out" class="secondary" type="button" hidden>Sign out</button>
    </div>

    <section id="sign-in" class="panel sign-in" aria-labelledby="sign-in-title">
      <h2 id="sign-in-title">Lab sign-in</h2>
      <form id="sign-in-form">
        <div>
          <label for="email">Synthetic email</label>
          <input id="email" name="email" type="email" autocomplete="off" maxlength="255" required>
        </div>
        <div>
          <label for="subject">Synthetic subject</label>
          <input id="subject" name="subject" autocomplete="off" maxlength="255" required>
        </div>
        <button id="submit" type="submit">Sign in</button>
      </form>
    </section>

    <p id="status" class="status" role="status" aria-atomic="true"></p>
    <section id="catalog" class="panel" aria-labelledby="catalog-title" hidden>
      <div class="catalog-header">
        <div>
          <h2 id="catalog-title">Permitted assets</h2>
          <p id="identity"></p>
        </div>
        <button id="refresh" class="secondary" type="button">Refresh catalog</button>
      </div>
      <ul id="assets" aria-label="Permitted assets"></ul>
    </section>
  </main>
</body>
</html>
